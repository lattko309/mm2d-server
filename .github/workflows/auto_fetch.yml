name: Auto Fetch Myanmar 2D Official Result

on:
  schedule:
    # 🇲🇲 မြန်မာစံတော်ချိန် မနက် 12:05 PM (UTC Time: 05:35 AM)
    - cron: '35 5 * * 1-5'
    # 🇲🇲 မြန်မာစံတော်ချိန် ညနေ 04:35 PM (UTC Time: 10:05 AM)
    - cron: '5 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-auto-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin playwright pytz
          playwright install chromium
          playwright install-deps

      - name: Execute Script
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.SERVICE_ACCOUNT_KEY }}
        run: |
          python fetch_missing_history.py
